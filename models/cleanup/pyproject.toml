[project]
name = "cleanup"
version = "0.1.0"
description = "fine-tuned small LLM that cleans Mumble dictation transcripts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46,<5",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=3.0",
    "accelerate>=1.0",
    "sacrebleu>=2.4",
    "jiwer>=3.0",
    "sentence-transformers>=3.0",
    "optimum[onnxruntime]>=1.23",
    "onnxruntime>=1.19",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.2",
    "tqdm>=4.66",
    "huggingface_hub>=0.25",
]

# errant pulls spacy and a language model, so the heavy edit-metric is optional.
# install with: uv sync --extra errant ; python -m spacy download en_core_web_sm
[project.optional-dependencies]
errant = ["errant>=3.0", "spacy>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanup"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
