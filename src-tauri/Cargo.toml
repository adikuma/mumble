[package]
name = "mumble"
version = "0.1.0"
description = "Mumble — Hex-style voice dictation for Windows"
authors = ["Aditya Kumar <aditya.kumar@getsolar.ai>"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "mumble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Async / concurrency ---
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
# lock-free spsc ring used by the audio capture worker. lets the cpal
# callback push samples without acquiring any contended lock.
rtrb = "0.3"

# --- Errors / logging ---
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Filesystem / paths ---
dirs = "5"

# --- Identifiers ---
# uuid v4 powers the transcript id generator. random ids avoid the
# wallclock collision risk of the previous monotonic nanos format.
uuid = { version = "1", features = ["v4"] }

# --- Bounded cache ---
lru = "0.12"

# --- History persistence ---
rusqlite = { version = "0.31", features = ["bundled"] }

# --- Clipboard + keystroke injection ---
# keystroke injection (ctrl+v) is done with raw `SendInput` from the
# `windows` crate. enigo was previously used for this and has been dropped
# because the scancode based send is faster, has no allocator path, and
# matches the dependency surface hex uses on macos.
arboard = "3"

# --- Downloads ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"

# --- Time ---
chrono = { version = "0.4", features = ["serde"] }

# --- Encoding ---
base64 = "0.22"
miniz_oxide = "0.8"

# --- Audio capture (cross-platform; uses WASAPI on Windows) ---
cpal = "0.15"

# --- Global hotkey (key-down / key-up events for push-to-talk) ---
rdev = "0.5"

# --- Cleanup model inference (optional Qwen2.5-0.5B fp32 ONNX) ---
# ort uses load-dynamic so it never links its own onnxruntime; it loads a
# modern onnxruntime.dll at runtime (ORT_DYLIB_PATH), kept separate from the
# old runtime sherpa bundles. rc.10 is pinned because rc.12 fails to compile
# (an ungated vitis EP module references a missing ort-sys binding).
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

# --- Speech recognition: sherpa-onnx Rust bindings (Parakeet-TDT v3).
# Bundled feature builds the C++ deps via cmake. Expect a long first build.
# Only compiled on Windows; on other targets we use a stub implementation
# so developers can still `cargo check` from non-Windows hosts.
[target.'cfg(windows)'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["directml"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[features]
default = []
# When enabled, use a deterministic stub transcriber that echoes a fixed string.
# Useful for frontend-only smoke tests from non-Windows hosts.
mock-transcribe = []
