[package]
name = "mumble-scaffold"
version = "0.1.0"
description = "Mumble — Hex-style voice dictation for Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "mumble_scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Async / concurrency ---
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"

# --- Errors / logging ---
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Filesystem / paths ---
dirs = "5"
directories = "5"

# --- History persistence ---
rusqlite = { version = "0.31", features = ["bundled"] }

# --- Clipboard + keystroke injection ---
arboard = "3"
enigo = "0.2"

# --- Downloads ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"

# --- Time ---
chrono = { version = "0.4", features = ["serde"] }

# --- Audio capture (cross-platform; uses WASAPI on Windows) ---
cpal = "0.15"
hound = "3.5"  # WAV writer
ringbuf = "0.4"

# --- Global hotkey (key-down / key-up events for push-to-talk) ---
rdev = "0.5"

# --- Speech recognition: sherpa-onnx Rust bindings (Parakeet-TDT v3).
# Bundled feature builds the C++ deps via cmake. Expect a long first build.
# Only compiled on Windows; on other targets we use a stub implementation
# so developers can still `cargo check` from non-Windows hosts.
[target.'cfg(windows)'.dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["directml"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Media_Audio",
] }

[features]
default = []
# When enabled, use a deterministic stub transcriber that echoes a fixed string.
# Useful for frontend-only smoke tests from non-Windows hosts.
mock-transcribe = []
