<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mumble — 3 Designs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f4f4f5; font-family: var(--font-sans); }
  body { overflow: hidden; }

  /* ── Shared mumble-design styles ─────────────── */
  .m-app {
    width: 100%; height: 100%;
    background: var(--background); color: var(--foreground);
    display: flex; overflow: hidden;
    font-family: var(--font-sans);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .m-titlebar {
    height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    background: var(--sidebar);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  .m-titlebar .traffic { display: flex; gap: 8px; }
  .m-titlebar .traffic span { width: 12px; height: 12px; border-radius: 999px; background: #ddd; }
  .m-titlebar .traffic span:nth-child(1) { background: #ff5f57; }
  .m-titlebar .traffic span:nth-child(2) { background: #febc2e; }
  .m-titlebar .traffic span:nth-child(3) { background: #28c840; }
  .m-titlebar .title { font-size: 11px; color: var(--muted-foreground); font-weight: 500; }

  .m-sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
    display: flex; flex-direction: column;
    color: var(--sidebar-foreground);
  }
  .m-sidebar-brand {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 14px 12px;
  }
  .m-sidebar-brand svg { color: var(--foreground); }
  .m-sidebar-brand .name { font-size: 13px; font-weight: 600; line-height: 1.1; }
  .m-sidebar-brand .ver { font-size: 10px; color: var(--muted-foreground); line-height: 1.1; }
  .m-sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; flex: 1; }
  .m-nav-item {
    display: flex; align-items: center; gap: 10px;
    height: 32px; padding: 0 10px;
    border-radius: 6px;
    font-size: 13px; font-weight: 500;
    color: var(--sidebar-foreground); cursor: pointer; user-select: none;
    transition: background-color 150ms;
  }
  .m-nav-item:hover { background: var(--sidebar-accent); }
  .m-nav-item.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .m-nav-item svg { width: 14px; height: 14px; }
  .m-sidebar-foot {
    border-top: 1px solid var(--sidebar-border);
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--muted-foreground);
  }
  .m-sidebar-foot .kbd {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 6px; font-size: 11px; color: var(--foreground); background: var(--background);
    font-weight: 500;
  }

  /* Theme segmented control */
  .theme-seg {
    display: inline-flex; padding: 2px;
    background: var(--muted); border-radius: 999px;
    gap: 2px;
  }
  .theme-seg button {
    border: none; background: transparent;
    width: 22px; height: 22px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted-foreground);
    transition: background 150ms, color 150ms;
  }
  .theme-seg button.on {
    background: var(--background); color: var(--foreground);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .theme-seg button svg { width: 12px; height: 12px; }

  .m-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--background); }
  .m-header {
    height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .m-header .lhs { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .m-header .meta { font-size: 11px; color: var(--muted-foreground); font-weight: 400; }
  .m-icon-btn {
    width: 28px; height: 28px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--foreground);
  }
  .m-icon-btn:hover { background: var(--accent); }

  .m-tabular { font-variant-numeric: tabular-nums; }
  .ico { width: 14px; height: 14px; flex-shrink: 0; }

  /* === Design 1: Canonical history === */
  .d1-search-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .d1-search { flex: 1; position: relative; }
  .d1-search input {
    width: 100%; height: 32px; padding: 0 10px 0 30px;
    border: 1px solid var(--input); border-radius: 6px;
    background: var(--background); font-size: 13px; font-family: inherit;
    color: var(--foreground);
  }
  .d1-search input:focus { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .d1-search .ico-search { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); }
  .d1-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); flex: 1; min-height: 0; }
  .d1-list { overflow-y: auto; border-right: 1px solid var(--border); }
  .d1-row {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background 150ms;
  }
  .d1-row:hover { background: var(--muted); }
  .d1-row.active { background: var(--accent); }
  .d1-row-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 11px; color: var(--muted-foreground); }
  .d1-row-meta .badge { background: var(--muted); color: var(--muted-foreground); padding: 1px 6px; border-radius: 4px; font-weight: 500; }
  .d1-row-text { font-size: 13px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d1-detail { padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .d1-detail-head { display: flex; align-items: center; justify-content: space-between; }
  .d1-detail-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted-foreground); }
  .d1-detail-actions { display: flex; gap: 2px; }
  .d1-body { font-size: 14px; line-height: 1.7; color: var(--foreground); }
  .d1-foot { display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted-foreground); }

  /* === Design 2: Insights === */
  .d3-content { padding: 28px 32px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 24px; }
  .d3-h h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .d3-h .sub { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; }
  .d3-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .d3-stat {
    border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    background: var(--card);
  }
  .d3-stat-label { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
  .d3-stat-value { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .d3-stat-delta { font-size: 11px; color: var(--muted-foreground); margin-top: 2px; }
  .d3-section-title { font-size: 13px; font-weight: 600; }
  .d3-chart { border: 1px solid var(--border); border-radius: 8px; padding: 18px; background: var(--card); display: flex; flex-direction: column; gap: 14px; }
  .d3-bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
  .d3-bar { flex: 1; background: var(--foreground); border-radius: 2px 2px 0 0; min-height: 2px; opacity: 0.85; }
  .d3-x-labels { display: flex; gap: 6px; font-size: 10px; color: var(--muted-foreground); }
  .d3-x-labels span { flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .d3-two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
  .d3-list { border: 1px solid var(--border); border-radius: 8px; padding: 4px 0; background: var(--card); }
  .d3-list-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; font-size: 13px; }
  .d3-list-row + .d3-list-row { border-top: 1px solid var(--border); }
  .d3-list-row .v { font-variant-numeric: tabular-nums; color: var(--muted-foreground); font-size: 12px; }

  /* === Design 3: Recording pill + transcript bubble above === */
  .pill-stage {
    width: 100%; height: 100%;
    background:
      radial-gradient(circle at 30% 20%, rgba(0,0,0,0.04), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.03), transparent 50%),
      var(--background);
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    font-family: var(--font-sans);
  }
  .dark .pill-stage {
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.03), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.02), transparent 50%),
      var(--background);
  }
  .pill-stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  /* Transcript bubble — floats above the pill */
  .transcript-bubble {
    position: relative;
    max-width: 360px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px; line-height: 1.5;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--foreground);
    box-shadow: 0 8px 24px -10px rgba(0,0,0,0.18);
  }
  .transcript-bubble .ghost { color: var(--muted-foreground); }
  .transcript-bubble::after {
    content: ""; position: absolute;
    bottom: -6px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px;
    background: var(--card);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  /* Recording pill — just dot + waveform + time. No transcript inside. */
  .rec-pill {
    border-radius: 999px; padding: 8px 14px 8px 12px;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .rec-pill .dot {
    width: 7px; height: 7px; border-radius: 999px; background: #ef4444;
    flex-shrink: 0;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .rec-pill .wave { display: flex; align-items: center; gap: 2px; height: 16px; width: 60px; flex-shrink: 0; }
  .rec-pill .wave span { flex: 1; max-width: 2px; min-width: 2px; border-radius: 1px; }
  .rec-pill .time { font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; opacity: 0.7; }

  /* Light pill */
  .rec-pill.light {
    background: #fff; border: 1px solid var(--border);
    box-shadow: 0 8px 22px -10px rgba(0,0,0,0.18), 0 1px 0 rgba(255,255,255,0.6) inset;
    color: var(--foreground);
  }
  .rec-pill.light .wave span { background: var(--foreground); }
  .rec-pill.light .time { color: var(--muted-foreground); }

  /* Dark pill */
  .rec-pill.dark {
    background: #18181b;
    box-shadow: 0 12px 26px -12px rgba(0,0,0,0.5);
    color: #fafafa;
  }
  .rec-pill.dark .dot { background: #f87171; }
  .rec-pill.dark .wave span { background: rgba(250,250,250,0.9); }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  /* === Design 4: Settings === */
  .s-scroll { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
  .s-content { box-sizing: border-box; padding: 28px 36px 40px; max-width: 640px; width: 100%; }
  .s-h { display: flex; flex-direction: column; gap: 4px; margin-bottom: 24px; }
  .s-h h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .s-h .sub { font-size: 12px; color: var(--muted-foreground); }

  .s-section { display: flex; flex-direction: column; gap: 4px; padding: 18px 0; border-top: 1px solid var(--border); }
  .s-section:first-of-type { border-top: none; padding-top: 0; }
  .s-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-foreground); font-weight: 600; margin-bottom: 8px; }

  .s-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; gap: 16px;
  }
  .s-row + .s-row { border-top: 1px solid var(--border); }
  .s-row-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .s-row-label .name { font-size: 13px; font-weight: 500; color: var(--foreground); }
  .s-row-label .desc { font-size: 12px; color: var(--muted-foreground); line-height: 1.4; }
  .s-row-control { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }

  .s-kbd {
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--background);
    padding: 4px 10px; font-size: 12px; font-weight: 500;
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, monospace);
    color: var(--foreground);
    box-shadow: 0 1px 0 var(--border);
  }
  .s-select {
    border: 1px solid var(--input); border-radius: 6px;
    background: var(--background); color: var(--foreground);
    padding: 5px 28px 5px 10px; font-size: 12px; font-family: inherit;
    appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
  }
  .s-select:focus { outline: none; box-shadow: 0 0 0 2px var(--ring); }

  .s-toggle {
    width: 30px; height: 18px; border-radius: 999px;
    background: var(--muted); position: relative; cursor: pointer;
    transition: background 150ms;
    flex-shrink: 0;
  }
  .s-toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 999px;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.18);
    transition: transform 150ms;
  }
  .s-toggle.on { background: var(--foreground); }
  .s-toggle.on::after { transform: translateX(12px); }

  .s-meter {
    width: 120px; height: 4px; border-radius: 999px; background: var(--muted);
    overflow: hidden; position: relative;
  }
  .s-meter-fill { position: absolute; inset: 0; right: auto; background: var(--foreground); border-radius: 999px; transition: width 90ms; }

  .s-input {
    border: 1px solid var(--input); border-radius: 6px;
    background: var(--background); color: var(--foreground);
    padding: 6px 10px; font-size: 12px; font-family: inherit;
    width: 180px;
  }
  .s-input:focus { outline: none; box-shadow: 0 0 0 2px var(--ring); }

  .s-pill {
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 9px; font-size: 11px; color: var(--muted-foreground);
    font-weight: 500;
  }
  .s-pill.ok { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }

  .s-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted-foreground);
  }
  .s-foot a { color: var(--foreground); text-decoration: none; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" src="../design-canvas.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const ICO = {
  history: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
  settings: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
  mic: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>,
  search: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  copy: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
  trash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>,
  back: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>,
  chart: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="ico"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>,
};

function Titlebar({ title }) {
  return (
    <div className="m-titlebar">
      <div className="traffic"><span/><span/><span/></div>
      <div className="title">{title}</div>
      <div style={{ width: 52 }} />
    </div>
  );
}

function Sidebar({ active, theme, setTheme }) {
  return (
    <aside className="m-sidebar">
      <div className="m-sidebar-brand">
        {ICO.mic}
        <div>
          <div className="name">Mumble</div>
          <div className="ver">v0.1.0</div>
        </div>
      </div>
      <nav className="m-sidebar-nav">
        <div className={"m-nav-item " + (active === "history" ? "active" : "")}>
          {ICO.history}<span>History</span>
        </div>
        <div className={"m-nav-item " + (active === "insights" ? "active" : "")}>
          {ICO.chart}<span>Insights</span>
        </div>
        <div className={"m-nav-item " + (active === "settings" ? "active" : "")}>
          {ICO.settings}<span>Settings</span>
        </div>
      </nav>
      <div className="m-sidebar-foot">
        <span>Theme</span>
        <div className="theme-seg">
          <button className={theme === "light" ? "on" : ""} onClick={() => setTheme && setTheme("light")} title="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button className={theme === "dark" ? "on" : ""} onClick={() => setTheme && setTheme("dark")} title="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </aside>
  );
}

// ── Live waveform component (shared) ─────────
function useLiveBars(count = 24, intervalMs = 70) {
  const [bars, setBars] = useState(() => Array.from({ length: count }, () => 30));
  useEffect(() => {
    const id = setInterval(() => {
      setBars(prev => {
        const rest = prev.slice(1);
        const e = 25 + Math.random() * 75;
        return [...rest, e];
      });
    }, intervalMs);
    return () => clearInterval(id);
  }, [count, intervalMs]);
  return bars;
}

// ── Design 1: Canonical history ─────────
function D1_Canonical({ theme = "light", setTheme }) {
  const [sel, setSel] = useState("t3");
  const rows = [
    { id: "t1", time: "2 min ago", dur: "0:12", text: "Let's ship the new dictation flow before end of week. I think we can get the hotkey latency under 80 milliseconds." },
    { id: "t2", time: "18 min ago", dur: "0:05", text: "Remind me to check the Parakeet model size before we add it to the bundle." },
    { id: "t3", time: "1 hr ago", dur: "0:27", text: "The ring buffer approach from Hex is actually genius." },
    { id: "t4", time: "3 hr ago", dur: "0:08", text: "Okay testing this on VS Code now. Pressing right control, speaking, releasing. Looks clean." },
    { id: "t5", time: "Yesterday", dur: "0:42", text: "Long-form test. We want to verify that sherpa-onnx handles three minute clips." },
  ];
  const cur = rows.find(r => r.id === sel);
  return (
    <div className="m-app" style={{flexDirection:"column"}}>
      <Titlebar title="Mumble" />
      <div style={{ display:"flex", flex:1, minHeight:0 }}>
        <Sidebar active="history" theme={theme} setTheme={setTheme} />
        <main className="m-main">
          <div className="m-header"><div className="lhs">History <span className="meta">· 5 transcripts</span></div></div>
          <div className="d1-search-bar">
            <div className="d1-search">
              <span className="ico-search">{ICO.search}</span>
              <input placeholder="Search transcripts…" />
            </div>
            <button className="m-icon-btn" title="Clear all">{ICO.trash}</button>
          </div>
          <div className="d1-grid">
            <div className="d1-list">
              {rows.map(r => (
                <div key={r.id} className={"d1-row " + (r.id === sel ? "active" : "")} onClick={() => setSel(r.id)}>
                  <div className="d1-row-meta">
                    <span>{r.time}</span>
                    <span className="badge">{r.dur}</span>
                  </div>
                  <div className="d1-row-text">{r.text}</div>
                </div>
              ))}
            </div>
            <div className="d1-detail">
              <div className="d1-detail-head">
                <div className="d1-detail-meta">
                  <span>{cur.time}</span>
                  <span style={{ background:"var(--muted)", color:"var(--muted-foreground)", padding:"2px 7px", borderRadius:4, fontWeight:500 }}>{cur.dur}</span>
                </div>
                <div className="d1-detail-actions">
                  <button className="m-icon-btn">{ICO.copy}</button>
                  <button className="m-icon-btn">{ICO.back}</button>
                  <button className="m-icon-btn">{ICO.trash}</button>
                </div>
              </div>
              <div className="d1-body">
                The ring buffer approach from Hex is actually genius. They keep one second of audio warm at all times, and on hotkey press they prepend roughly four hundred and fifty milliseconds of it to the file. That's why it catches the first syllable.
              </div>
              <div className="d1-foot">
                <span>Input: System Default</span>
                <span>Parakeet-TDT v3 · en</span>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

// ── Design 2: Insights ─────────

// ── Design 3: Recording pill with transcript bubble above ─────
function RecPill({ variant }) {
  const bars = useLiveBars(14, 75);
  return (
    <div className={"rec-pill " + variant}>
      <span className="dot" />
      <div className="wave">
        {bars.map((h, i) => <span key={i} style={{ height: `${25 + h*0.6}%` }} />)}
      </div>
      <span className="time">0:07</span>
    </div>
  );
}

function D3_Pills({ theme = "light" }) {
  return (
    <div className="m-app" style={{flexDirection:"column"}}>
      <Titlebar title="Mumble — Recording" />
      <div className="pill-stage">
        <div className="pill-stack">
          <div className="transcript-bubble">
            The ring buffer approach is actually <span className="ghost">geni…</span>
          </div>
          <RecPill variant={theme === "dark" ? "dark" : "light"} />
        </div>
      </div>
    </div>
  );
}

// ── Design 4: Settings ─────────
function Toggle({ on, onChange }) {
  return <div className={"s-toggle " + (on ? "on" : "")} onClick={() => onChange(!on)} />;
}

function D4_Settings({ theme = "light", setTheme }) {
  const [hotkey, setHotkey] = useState("Right Ctrl");
  const [autoPaste, setAutoPaste] = useState(true);
  const [autoPunc, setAutoPunc] = useState(true);
  const [removeFillers, setRemoveFillers] = useState(false);
  const [launchAtLogin, setLaunchAtLogin] = useState(true);
  const [analytics, setAnalytics] = useState(false);
  const [meter, setMeter] = useState(0);

  useEffect(() => {
    const id = setInterval(() => setMeter(20 + Math.random() * 70), 100);
    return () => clearInterval(id);
  }, []);

  return (
    <div className="m-app" style={{flexDirection:"column"}}>
      <Titlebar title="Mumble — Settings" />
      <div style={{ display:"flex", flex:1, minHeight:0 }}>
        <Sidebar active="settings" theme={theme} setTheme={setTheme} />
        <main className="m-main">
          <div className="m-header"><div className="lhs">Settings</div></div>
          <div className="s-scroll">
          <div className="s-content">

            <div className="s-section">
              <div className="s-section-title">Hotkey</div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Push-to-talk key</span>
                  <span className="desc">Hold to record. Release to transcribe and paste.</span>
                </div>
                <div className="s-row-control">
                  <span className="s-kbd">{hotkey}</span>
                  <button className="m-icon-btn" style={{ width:"auto", padding:"0 10px", fontSize:12, height:28, border:"1px solid var(--input)" }}>Change</button>
                </div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Pre-roll buffer</span>
                  <span className="desc">Captures audio just before you press the key, so it never clips your first syllable.</span>
                </div>
                <div className="s-row-control">
                  <select className="s-select" defaultValue="450">
                    <option value="0">Off</option>
                    <option value="250">250 ms</option>
                    <option value="450">450 ms</option>
                    <option value="800">800 ms</option>
                  </select>
                </div>
              </div>
            </div>

            <div className="s-section">
              <div className="s-section-title">Audio</div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Input device</span>
                  <span className="desc">Microphone used during recording.</span>
                </div>
                <div className="s-row-control">
                  <select className="s-select" defaultValue="default">
                    <option value="default">System Default — MacBook Pro Mic</option>
                    <option value="airpods">AirPods Pro</option>
                    <option value="shure">Shure MV7</option>
                  </select>
                </div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Input level</span>
                  <span className="desc">Live signal from your selected mic.</span>
                </div>
                <div className="s-row-control">
                  <div className="s-meter"><div className="s-meter-fill" style={{ width: `${meter}%` }} /></div>
                </div>
              </div>
            </div>

            <div className="s-section">
              <div className="s-section-title">Transcription</div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Model</span>
                  <span className="desc">Runs locally. Larger = more accurate, more memory.</span>
                </div>
                <div className="s-row-control">
                  <select className="s-select" defaultValue="parakeet">
                    <option value="parakeet">Parakeet-TDT v3 · 600 MB</option>
                    <option value="whisper-base">Whisper Base · 150 MB</option>
                    <option value="whisper-small">Whisper Small · 480 MB</option>
                  </select>
                  <span className="s-pill ok">Loaded</span>
                </div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Language</span>
                  <span className="desc">Currently English-only. More coming.</span>
                </div>
                <div className="s-row-control">
                  <select className="s-select" defaultValue="en">
                    <option value="en">English (US)</option>
                  </select>
                </div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Auto-punctuation</span>
                  <span className="desc">Adds commas and periods based on prosody.</span>
                </div>
                <div className="s-row-control"><Toggle on={autoPunc} onChange={setAutoPunc} /></div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Remove fillers</span>
                  <span className="desc">Strips um, uh, like, you know.</span>
                </div>
                <div className="s-row-control"><Toggle on={removeFillers} onChange={setRemoveFillers} /></div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Custom dictionary</span>
                  <span className="desc">Proper nouns and replacements. 12 entries.</span>
                </div>
                <div className="s-row-control">
                  <button className="m-icon-btn" style={{ width:"auto", padding:"0 10px", fontSize:12, height:28, border:"1px solid var(--input)" }}>Edit…</button>
                </div>
              </div>
            </div>

            <div className="s-section">
              <div className="s-section-title">Behavior</div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Auto-paste at cursor</span>
                  <span className="desc">Drops the transcript wherever your caret is.</span>
                </div>
                <div className="s-row-control"><Toggle on={autoPaste} onChange={setAutoPaste} /></div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Launch at login</span>
                </div>
                <div className="s-row-control"><Toggle on={launchAtLogin} onChange={setLaunchAtLogin} /></div>
              </div>
              <div className="s-row">
                <div className="s-row-label">
                  <span className="name">Send anonymous analytics</span>
                  <span className="desc">No transcript content ever leaves your machine.</span>
                </div>
                <div className="s-row-control"><Toggle on={analytics} onChange={setAnalytics} /></div>
              </div>
            </div>

            <div className="s-foot">
              <span>Mumble v0.1.0 · <a href="#">Check for updates</a></span>
              <a href="#">Reset to defaults</a>
            </div>
          </div>
          </div>
        </main>
      </div>
    </div>
  );
}

function ThemedFrame({ theme, children }) {
  return (
    <div className={theme === "dark" ? "dark" : ""} style={{ width:"100%", height:"100%", background:"var(--background)" }}>
      {children}
    </div>
  );
}

function ThemedBoard({ Component, initial }) {
  const [theme, setTheme] = useState(initial);
  return (
    <ThemedFrame theme={theme}>
      <Component theme={theme} setTheme={setTheme} />
    </ThemedFrame>
  );
}

function App() {
  return (
    <DesignCanvas projectTitle="Mumble — Light & Dark">
      <DCSection id="light" title="Light theme">
        <DCArtboard id="d1l" label="01 · History · light" width={960} height={620}>
          <ThemedBoard Component={D1_Canonical} initial="light" />
        </DCArtboard>
        <DCArtboard id="d2l" label="02 · Insights · light" width={960} height={620}>
          <ThemedBoard Component={D2_Insights} initial="light" />
        </DCArtboard>
        <DCArtboard id="d3l" label="03 · Recording capsule · light" width={560} height={420}>
          <ThemedBoard Component={D3_Pills} initial="light" />
        </DCArtboard>
        <DCArtboard id="d4l" label="04 · Settings · light" width={960} height={680}>
          <ThemedBoard Component={D4_Settings} initial="light" />
        </DCArtboard>
      </DCSection>
      <DCSection id="dark" title="Dark theme">
        <DCArtboard id="d1d" label="01 · History · dark" width={960} height={620}>
          <ThemedBoard Component={D1_Canonical} initial="dark" />
        </DCArtboard>
        <DCArtboard id="d2d" label="02 · Insights · dark" width={960} height={620}>
          <ThemedBoard Component={D2_Insights} initial="dark" />
        </DCArtboard>
        <DCArtboard id="d3d" label="03 · Recording capsule · dark" width={560} height={420}>
          <ThemedBoard Component={D3_Pills} initial="dark" />
        </DCArtboard>
        <DCArtboard id="d4d" label="04 · Settings · dark" width={960} height={680}>
          <ThemedBoard Component={D4_Settings} initial="dark" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
