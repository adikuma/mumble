<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-frame">
  <span class="section-label">Borders — 1px uniform · selection = persistent hover</span>
  <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; padding:0; overflow:hidden;">
    <div style="padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px;">Idle row</div>
    <div style="padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; background:rgba(228,228,231,0.5);">Hover · bg-accent/50</div>
    <div style="padding:12px 16px; font-size:13px; background:rgba(228,228,231,0.5);">Selected · bg-accent/50 (same as hover, persistent)</div>
  </div>
  <div class="muted" style="font-size:11px;">No left accent bar, no stronger fill. Selected is identical to hover — it just stays put when the pointer leaves.</div>
</div></body></html>
