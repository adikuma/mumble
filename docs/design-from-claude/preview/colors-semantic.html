<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-frame">
  <span class="section-label">Semantic pairs — fg on bg</span>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
    <div style="background:var(--background); color:var(--foreground); border:1px solid var(--border); border-radius:8px; padding:14px;"><div style="font-size:13px; font-weight:500;">Canvas</div><div class="swatch-meta">background → foreground</div></div>
    <div style="background:var(--primary); color:var(--primary-foreground); border-radius:8px; padding:14px;"><div style="font-size:13px; font-weight:500;">Primary</div><div style="font-size:10px; opacity:.7;">primary → primary-fg</div></div>
    <div style="background:var(--secondary); color:var(--secondary-foreground); border-radius:8px; padding:14px;"><div style="font-size:13px; font-weight:500;">Secondary</div><div class="swatch-meta">secondary → secondary-fg</div></div>
    <div style="background:var(--muted); color:var(--muted-foreground); border-radius:8px; padding:14px;"><div style="font-size:13px; font-weight:500;">Muted</div><div style="font-size:10px;">muted → muted-fg</div></div>
    <div style="background:var(--accent); color:var(--accent-foreground); border-radius:8px; padding:14px;"><div style="font-size:13px; font-weight:500;">Accent</div><div class="swatch-meta">= muted in this theme</div></div>
    <div style="background:var(--destructive); color:var(--destructive-foreground); border-radius:8px; padding:14px;"><div style="font-size:13px; font-weight:500;">Destructive</div><div style="font-size:10px; opacity:.85;">destructive → fg</div></div>
  </div>
</div></body></html>
