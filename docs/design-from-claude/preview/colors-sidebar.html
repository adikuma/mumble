<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-frame">
  <span class="section-label">Sidebar tokens — separate plane</span>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
    <div style="background:hsl(0 0% 98%); border:1px solid hsl(240 5.9% 90%); border-radius:8px; padding:14px;">
      <div style="font-size:11px; color:hsl(240 3.8% 46.1%); margin-bottom:6px;">Light</div>
      <div style="font-size:13px; color:hsl(240 5.3% 26.1%); font-weight:500;">sidebar-foreground</div>
      <div style="height:8px;"></div>
      <div style="background:hsl(240 4.8% 95.9%); border-radius:6px; padding:6px 10px; font-size:13px; color:hsl(240 5.9% 10%); font-weight:500;">sidebar-accent (active row)</div>
    </div>
    <div style="background:hsl(240 5.9% 10%); border:1px solid hsl(240 3.7% 15.9%); border-radius:8px; padding:14px;">
      <div style="font-size:11px; color:hsl(240 5% 64.9%); margin-bottom:6px;">Dark</div>
      <div style="font-size:13px; color:hsl(240 4.8% 95.9%); font-weight:500;">sidebar-foreground</div>
      <div style="height:8px;"></div>
      <div style="background:hsl(240 3.7% 15.9%); border-radius:6px; padding:6px 10px; font-size:13px; color:hsl(0 0% 98%); font-weight:500;">sidebar-accent (active row)</div>
    </div>
  </div>
</div></body></html>
