<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-frame">
  <div class="card">
    <div style="padding:16px 16px 8px;">
      <div style="font-size:13px; font-weight:600; letter-spacing:-0.005em;">Hotkey</div>
      <div style="font-size:11px; color:var(--muted-foreground); margin-top:2px;">Hold anywhere on your system to record, release to transcribe.</div>
    </div>
    <div style="padding:8px 16px 16px; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:13px;">Push-to-talk key</span>
      <div class="row">
        <span style="font-size:13px; font-weight:500; color:var(--foreground); letter-spacing:0.01em;">Right Ctrl</span>
        <button class="btn" data-variant="outline" data-size="sm">Change</button>
      </div>
    </div>
  </div>
</div></body></html>
